name: NBA50 DoorDash Monitor

on:
  schedule:
    # UTC 时间 02:00、04:00、07:00 运行 NBA 监控
    # 对应美西时间：PST 前一天 6PM、8PM、11PM；PDT 前一天 7PM、9PM及当天 12AM
    - cron: '0 2,4,7 * * *'
  workflow_dispatch: # 允许手动运行

concurrency:
  group: nba50-monitor
  cancel-in-progress: false

jobs:
  check_nba:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore notification state
        uses: actions/cache/restore@v4
        with:
          path: .nba50_state.json
          key: ${{ runner.os }}-nba50-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-nba50-state-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NBA 50+ Points Monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          echo "🕐 当前时间: $(date)"
          echo "🏀 开始检查NBA球员50+得分情况..."
          
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "📅 自动调度运行 - NBA 50+监控"
          else
            echo "🔧 手动运行 - NBA 50+监控"
          fi
          python nba.py
          
          echo "✅ NBA监控完成"

      - name: Save notification state
        if: ${{ always() && hashFiles('.nba50_state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .nba50_state.json
          key: ${{ runner.os }}-nba50-state-${{ github.run_id }}-${{ github.run_attempt }}
