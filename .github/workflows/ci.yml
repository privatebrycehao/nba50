name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check .

      - name: Syntax check
        run: |
          python -m py_compile nba.py
          python -m py_compile lib/display.py
          python -m py_compile lib/webhook.py

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Import check
        run: python -c "import nba; from lib.display import get_home_away_competitors; from lib.webhook import detect_webhook_type; print('All imports OK')"
